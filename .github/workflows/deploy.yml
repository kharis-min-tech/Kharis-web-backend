name: deploy

# Tests every push and pull request; deploys to Cloudflare Workers on push to main.
# Worker secrets (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY) live in
# Cloudflare and are not touched by a deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: checkout only. The deploy authenticates to
# Cloudflare with CLOUDFLARE_API_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a94432b07dae8050b83efdec72a492a3
      API_URL: https://kharis-web-backend.itadmin-a94.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check deploy config
        run: ': "${CLOUDFLARE_API_TOKEN:?set the CLOUDFLARE_API_TOKEN repo secret}"'

      - name: Deploy to Cloudflare
        run: npm run deploy

      # A green deploy only means the Worker uploaded. Check it answers, and that
      # /v1/site/branches reaches Supabase (a 5xx means a missing or wrong secret).
      - name: Smoke test
        run: |
          for path in /health /v1/site/branches; do
            code=000
            for i in $(seq 1 6); do
              code=$(curl -s -o body.out -w '%{http_code}' --max-time 25 "$API_URL$path" || echo 000)
              echo "$path attempt $i: HTTP $code"
              case "$code" in
                2*) break ;;
                *) sleep 10 ;;
              esac
            done
            case "$code" in
              2*) echo "OK: $API_URL$path" ;;
              *) echo "::error::$API_URL$path returned HTTP $code"; head -c 1000 body.out; exit 1 ;;
            esac
          done
